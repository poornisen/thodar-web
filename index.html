<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thodar Family Tree</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <!-- Balkan FamilyTreeJS Engine -->
    <script src="https://balkan.app/js/FamilyTree.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #16161f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        #tree {
            width: 100%;
            height: 100%;
        }

        /* Deceased Visual Treatment */
        .deceased image, .deceased img {
            filter: grayscale(100%) contrast(105%) !important;
            opacity: 0.88;
        }
        .deceased rect {
            stroke: #59596e !important;
            stroke-dasharray: 4, 2;
        }

        /* Stealth Top Bar */
        #topBar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(28, 28, 38, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #323247;
            border-radius: 12px;
            padding: 6px 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        #secretLogo {
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        #secretLogo svg {
            width: 18px;
            height: 18px;
            fill: #7b7b94;
        }
        #searchInput {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            padding: 6px 8px;
        }
        #searchInput::placeholder {
            color: #7b7b94;
        }

        #adminControls {
            display: none;
            align-items: center;
            gap: 8px;
        }
        .admin-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(0, 123, 255, 0.2);
            color: #4da3ff;
            border: 1px solid rgba(0, 123, 255, 0.4);
            white-space: nowrap;
        }
        .logout-btn {
            background: #2c2c3d;
            color: #d1d1e0;
            border: 1px solid #44445c;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        #searchDropdown {
            display: none;
            position: fixed;
            top: 62px;
            left: 12px;
            right: 12px;
            background: #212130;
            border: 1px solid #37374d;
            border-radius: 10px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1001;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
        }
        .search-item {
            padding: 10px 14px;
            color: #d1d1e0;
            font-size: 14px;
            border-bottom: 1px solid #2b2b3d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .search-item:last-child {
            border-bottom: none;
        }
        .search-item:hover, .search-item:active {
            background: #2c2c42;
            color: #4da3ff;
        }

        /* Toast */
        #toast {
            visibility: hidden;
            min-width: 170px;
            background-color: #007bff;
            color: #fff;
            text-align: center;
            border-radius: 20px;
            padding: 10px 18px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* Quick Navigation Action Dock (Bottom Right) */
        #actionDock {
            position: fixed;
            right: 14px;
            bottom: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .dock-btn {
            background: rgba(28, 28, 38, 0.92);
            border: 1px solid #3e3e58;
            color: #d1d1e0;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .dock-btn:active {
            background: #007bff;
            color: #ffffff;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #232332;
            border: 1px solid #37374d;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            color: #ffffff;
        }
        .modal-box h3 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 18px;
            color: #4da3ff;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #9d9db5;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            background: #181824;
            border: 1px solid #3b3b50;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .photo-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #181824;
            border: 1px dashed #40405c;
            border-radius: 8px;
            padding: 10px;
        }
        .photo-preview {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #2b2b3d;
            border: 1px solid #4a4a66;
            flex-shrink: 0;
        }
        .photo-picker-actions {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .upload-status {
            font-size: 11px;
            color: #4da3ff;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-cancel {
            background: #37374d;
            color: #d1d1e0;
        }
        .btn-save {
            background: #007bff;
            color: #ffffff;
        }
        .btn-choose {
            background: #333347;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid #4b4b66;
            cursor: pointer;
            width: fit-content;
        }
    </style>
</head>
<body>

    <!-- Top Search Bar -->
    <div id="topBar">
        <div id="secretLogo" onclick="handleSecretTap()" title="">
            <svg viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </div>
        <input type="text" id="searchInput" placeholder="Search relative by name..." oninput="handleSearch(this.value)" />
        
        <div id="adminControls">
            <span class="admin-badge">Admin</span>
            <button class="logout-btn" onclick="signOutAdmin()">Sign Out</button>
        </div>
    </div>
    <div id="searchDropdown"></div>

    <div id="tree"></div>
    <div id="toast">Saved</div>

    <!-- Quick Navigation Action Dock -->
    <div id="actionDock">
        <button class="dock-btn" onclick="toggleExpandCollapseAll()">
            <span id="expandAllIcon">⊟</span> <span id="expandAllText">Collapse Branches</span>
        </button>
        <button class="dock-btn" onclick="fitAndCenterTree()">
            <span>⌂</span> Reset View
        </button>
    </div>

    <!-- Admin Authentication Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="authTitle">Admin Authentication</h3>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="authEmail" placeholder="admin@example.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••" />
            </div>
            <div id="authError" style="display: none; color: #ff6b6b; font-size: 13px; margin-bottom: 12px;"></div>
            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn btn-cancel" onclick="closeAuthModal()">Close</button>
                <button class="btn btn-save" onclick="performAuth()">Authenticate</button>
            </div>
        </div>
    </div>

    <!-- Add Relative Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Add Relative</h3>
            <div class="form-group">
                <label>Relationship to Relative</label>
                <select id="relType">
                    <option value="child">Child (Son / Daughter)</option>
                    <option value="spouse">Spouse / Partner</option>
                    <option value="father">Father</option>
                    <option value="mother">Mother</option>
                </select>
            </div>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="personName" placeholder="e.g. S. Arunkumar" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="personGender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Living Status</label>
                    <select id="personDeceased" onchange="toggleDeceasedFields('add', this.value === 'true')">
                        <option value="false">Living</option>
                        <option value="true">Deceased</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Birth Year</label>
                    <input type="text" id="personBirth" placeholder="e.g. 1938" />
                </div>
                <div class="form-group" id="addPassingYearGroup" style="display: none;">
                    <label>Passing Year</label>
                    <input type="text" id="personDeath" placeholder="e.g. 2012" />
                </div>
            </div>
            <div class="form-group">
                <label>Hometown / Native Place</label>
                <input type="text" id="personPlace" placeholder="e.g. Salem, Chennai" />
            </div>
            <div class="form-group">
                <label>Profile Photo</label>
                <div class="photo-picker-container">
                    <img id="addPhotoPreview" class="photo-preview" src="https://balkan.app/avatar/1.jpg" alt="" />
                    <div class="photo-picker-actions">
                        <button type="button" class="btn-choose" onclick="document.getElementById('addPhotoFile').click()">Choose Photo</button>
                        <span id="addUploadStatus" class="upload-status">Gallery / Files</span>
                    </div>
                </div>
                <input type="file" id="addPhotoFile" accept="image/*" style="display: none;" onchange="handleImageSelection(this, 'add')" />
                <input type="hidden" id="addPhotoUrl" />
            </div>
            <div class="form-group">
                <label>Notes / Markers</label>
                <input type="text" id="personNotes" placeholder="e.g. *" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeAddModal()">Cancel</button>
                <button class="btn btn-save" id="addSaveBtn" onclick="saveRelative()">Add</button>
            </div>
        </div>
    </div>

    <!-- Edit Details Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="editModalTitle">Edit Person Details</h3>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="editPersonName" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Gender</label>
                    <select id="editPersonGender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Living Status</label>
                    <select id="editPersonDeceased" onchange="toggleDeceasedFields('edit', this.value === 'true')">
                        <option value="false">Living</option>
                        <option value="true">Deceased</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Birth Year</label>
                    <input type="text" id="editPersonBirth" placeholder="e.g. 1938" />
                </div>
                <div class="form-group" id="editPassingYearGroup" style="display: none;">
                    <label>Passing Year</label>
                    <input type="text" id="editPersonDeath" placeholder="e.g. 2012" />
                </div>
            </div>
            <div class="form-group">
                <label>Hometown / Native Place</label>
                <input type="text" id="editPersonPlace" placeholder="e.g. Salem" />
            </div>
            <div class="form-group">
                <label>Profile Photo</label>
                <div class="photo-picker-container">
                    <img id="editPhotoPreview" class="photo-preview" src="https://balkan.app/avatar/1.jpg" alt="" />
                    <div class="photo-picker-actions">
                        <button type="button" class="btn-choose" onclick="document.getElementById('editPhotoFile').click()">Choose Photo</button>
                        <span id="editUploadStatus" class="upload-status">Gallery / Files</span>
                    </div>
                </div>
                <input type="file" id="editPhotoFile" accept="image/*" style="display: none;" onchange="handleImageSelection(this, 'edit')" />
                <input type="hidden" id="editPhotoUrl" />
            </div>
            <div class="form-group">
                <label>Notes / Markers</label>
                <input type="text" id="editPersonNotes" placeholder="e.g. *" />
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-save" id="editSaveBtn" onclick="savePersonEdits()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDVhyNh8RRs3hDGwaxeHDrCgwKXQ7QJZ0Q",
            authDomain: "thodar-app.firebaseapp.com",
            projectId: "thodar-app",
            storageBucket: "thodar-app.firebasestorage.app",
            messagingSenderId: "857665151422",
            appId: "1:857665151422:web:0830eaa9ed71796b4059ef",
            measurementId: "G-E557ZRL6CX"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        const TENANT_ID = "thodar_devendran_01";
        const treeDocRef = db.collection("trees").doc(TENANT_ID);

        let currentUser = null;
        let isAdmin = false;
        let selectedNodeId = null;

        // Tracks which parent node IDs have their branches collapsed
        const collapsedParentIds = new Set();

        const defaultSeedData = [
            { id: 1, pids: [2], name: "N. Devendran", gender: "male", birthYear: "1938", deathYear: "", isDeceased: false, tags: [], place: "Salem", notes: "*" },
            { id: 2, pids: [1], name: "D. Leelavathy", gender: "female", birthYear: "1945", deathYear: "", isDeceased: false, tags: [], place: "Salem" },
            { id: 3, fid: 1, mid: 2, pids: [4], name: "D. Manivannan", gender: "male", birthYear: "1966", isDeceased: false, tags: [], place: "Salem" },
            { id: 4, pids: [3], name: "K.V. Lakshmi", gender: "female", birthYear: "1972", isDeceased: false, tags: [], place: "Erode" },
            { id: 5, fid: 1, mid: 2, pids: [7], name: "D. Sumathy", gender: "female", birthYear: "1969", isDeceased: false, tags: [], place: "Salem" },
            { id: 7, pids: [5], name: "S. Sundaresan", gender: "male", birthYear: "1964", isDeceased: false, tags: [], place: "Coimbatore" },
            { id: 8, fid: 1, mid: 2, pids: [9], name: "D. Vijayarani", gender: "female", birthYear: "1972", isDeceased: false, tags: [], place: "Salem" },
            { id: 9, pids: [8], name: "G.V. Ramesh", gender: "male", birthYear: "1968", isDeceased: false, tags: [], place: "Tiruppur" },
            { id: 10, fid: 1, mid: 2, pids: [11], name: "D. Senthil Kumar", gender: "male", birthYear: "1975", isDeceased: false, tags: [], place: "Salem" },
            { id: 11, pids: [10], name: "S. Poornima", gender: "female", birthYear: "1982", isDeceased: false, tags: [], place: "Trichy" },
            { id: 6, fid: 3, mid: 4, name: "P.M. Karthik Jogaian", gender: "male", birthYear: "1997", isDeceased: false, tags: [], place: "Bangalore" },
            { id: 12, fid: 3, mid: 4, name: "P.M. Ganga Devi", gender: "female", birthYear: "2001", isDeceased: false, tags: [], place: "Salem" }
        ];

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 2200);
        }

        let familyData = [];

        function loadLocalData() {
            try {
                if (window.AndroidBridge && typeof window.AndroidBridge.loadFamilyData === "function") {
                    const androidData = window.AndroidBridge.loadFamilyData();
                    if (androidData && androidData.trim().length > 5) {
                        return JSON.parse(androidData);
                    }
                }
                const webData = localStorage.getItem("thodar_family_data");
                if (webData && webData.trim().length > 5) {
                    return JSON.parse(webData);
                }
            } catch (err) {
                console.error("Local data load error:", err);
            }
            return JSON.parse(JSON.stringify(defaultSeedData));
        }

        familyData = loadLocalData();

        function syncNodeTags(member) {
            if (!member.tags) member.tags = [];
            if (member.isDeceased) {
                if (!member.tags.includes("deceased")) member.tags.push("deceased");
            } else {
                member.tags = member.tags.filter(t => t !== "deceased");
            }
        }
        familyData.forEach(syncNodeTags);

        // Helper: Get direct children count for a person or couple
        function getChildrenCount(personId) {
            const person = familyData.find(m => m.id == personId);
            if (!person) return 0;
            const pids = person.pids || [];
            return familyData.filter(m => (m.fid == personId || m.mid == personId) || 
                                          (pids.includes(m.fid) || pids.includes(m.mid))).length;
        }

        // Helper: Recursively collect all descendant IDs of a parent
        function getDescendantIds(parentId) {
            const descendants = new Set();
            const person = familyData.find(m => m.id == parentId);
            const parentIds = [parentId];
            if (person && person.pids) parentIds.push(...person.pids);

            function findChildren(currentParentIds) {
                const directChildren = familyData.filter(m => currentParentIds.includes(m.fid) || currentParentIds.includes(m.mid));
                directChildren.forEach(child => {
                    if (!descendants.has(child.id)) {
                        descendants.add(child.id);
                        const childAndSpouseIds = [child.id];
                        if (child.pids) childAndSpouseIds.push(...child.pids);
                        findChildren(childAndSpouseIds);
                    }
                });
            }

            findChildren(parentIds);
            return descendants;
        }

        // Generates the visible nodes subset based on collapsed branches
        function getVisibleNodes() {
            if (collapsedParentIds.size === 0) {
                return familyData;
            }

            const hiddenNodeIds = new Set();
            collapsedParentIds.forEach(parentId => {
                const branchDescendants = getDescendantIds(parentId);
                branchDescendants.forEach(id => hiddenNodeIds.add(id));
            });

            return familyData.filter(m => !hiddenNodeIds.has(m.id));
        }

        // --- 2. FAMILY TREE ENGINE CONFIGURATION ---
        let family = null;

        function initFamilyTree() {
            const container = document.getElementById("tree");
            container.innerHTML = "";

            const treeConfig = {
                template: "john",
                mode: "dark",
                mouseScrool: FamilyTree.action.zoom,
                miniMap: true,
                nodeBinding: {
                    field_0: "name",
                    field_1: function(sender, node) {
                        const parts = [];

                        if (node.isDeceased) {
                            if (node.birthYear && node.deathYear) {
                                parts.push(`${node.birthYear} – ${node.deathYear}`);
                            } else if (node.birthYear) {
                                parts.push(`b. ${node.birthYear} (Late)`);
                            } else {
                                parts.push("Late");
                            }
                        } else {
                            if (node.birthYear) parts.push("b. " + node.birthYear);
                        }

                        if (node.place) parts.push(node.place);
                        if (node.notes) parts.push(node.notes);

                        // If branch is currently collapsed, display a clear indicator tag
                        const count = getChildrenCount(node.id);
                        if (count > 0 && (collapsedParentIds.has(node.id) || (node.pids && node.pids.some(p => collapsedParentIds.has(p))))) {
                            parts.push(`[ ${count} Children Hidden ▼ ]`);
                        }

                        return parts.join(" • ");
                    },
                    img_0: "photo"
                },
                tags: {
                    deceased: { template: "john" }
                },
                nodes: getVisibleNodes()
            };

            const menuItems = {
                toggleBranch: {
                    text: function(nodeId) {
                        const count = getChildrenCount(nodeId);
                        if (count === 0) return "No Children";
                        const isCollapsed = collapsedParentIds.has(nodeId);
                        return isCollapsed ? `Expand Branch (+${count})` : `Collapse Branch (-${count})`;
                    },
                    onClick: function(nodeId) {
                        toggleSingleBranch(nodeId);
                    }
                }
            };

            if (isAdmin) {
                treeConfig.nodeMouseClick = function(nodeId) {
                    openEditModal(nodeId);
                };
                menuItems.addRel = {
                    text: "Add Relative",
                    onClick: function(nodeId) { openAddRelativeModal(nodeId); }
                };
                menuItems.edit = {
                    text: "Edit Details",
                    onClick: function(nodeId) { openEditModal(nodeId); }
                };
                menuItems.remove = { text: "Remove Person" };
                treeConfig.nodeMenu = menuItems;
            } else {
                treeConfig.nodeMouseClick = function(nodeId) {
                    // In viewer mode, tapping a parent card directly toggles their branch!
                    if (getChildrenCount(nodeId) > 0) {
                        toggleSingleBranch(nodeId);
                    }
                };
                treeConfig.nodeMenu = menuItems;
            }

            family = new FamilyTree(container, treeConfig);

            if (isAdmin) {
                family.onRemoveNode(function(args) {
                    const removeId = args.id;
                    familyData = familyData.filter(item => item.id != removeId);
                    familyData.forEach(item => {
                        if (item.pids && Array.isArray(item.pids)) {
                            item.pids = item.pids.filter(p => p != removeId);
                        }
                        if (item.fid == removeId) delete item.fid;
                        if (item.mid == removeId) delete item.mid;
                    });
                    saveToStorage();
                });
            }
        }

        initFamilyTree();

        // --- 3. DOCK CONTROLS (FUNCTIONAL EXPAND/COLLAPSE & RESET VIEW) ---
        function toggleSingleBranch(parentId) {
            const count = getChildrenCount(parentId);
            if (count === 0) return;

            if (collapsedParentIds.has(parentId)) {
                collapsedParentIds.delete(parentId);
                showToast("Branch Expanded");
            } else {
                collapsedParentIds.add(parentId);
                showToast("Branch Collapsed");
            }

            family.load(getVisibleNodes());
            updateDockButtonState();
        }

        function toggleExpandCollapseAll() {
            const btnText = document.getElementById("expandAllText");
            const btnIcon = document.getElementById("expandAllIcon");

            // If some or none are collapsed, collapse all Generation 2 parents
            if (collapsedParentIds.size === 0) {
                familyData.forEach(member => {
                    // Parents who have children and also have parents themselves (Generation 2)
                    if (getChildrenCount(member.id) > 0 && (member.fid || member.mid)) {
                        collapsedParentIds.add(member.id);
                    }
                });
                showToast("Branches Collapsed");
            } else {
                // Expand everything
                collapsedParentIds.clear();
                showToast("All Branches Expanded");
            }

            family.load(getVisibleNodes());
            updateDockButtonState();
            fitAndCenterTree();
        }

        function updateDockButtonState() {
            const btnText = document.getElementById("expandAllText");
            const btnIcon = document.getElementById("expandAllIcon");
            if (collapsedParentIds.size > 0) {
                btnText.innerText = "Expand All";
                btnIcon.innerText = "⊞";
            } else {
                btnText.innerText = "Collapse Branches";
                btnIcon.innerText = "⊟";
            }
        }

        // Centers and resets camera view smoothly
        function fitAndCenterTree() {
            if (!family) return;
            // Center on generation 1 root (id: 1)
            family.center(1, {
                valign: FamilyTree.valign.center,
                halign: FamilyTree.halign.center
            });
        }

        // --- 4. STEALTH GESTURE LOGIC (7 RAPID TAPS) ---
        let tapCount = 0;
        let tapResetTimer = null;

        function handleSecretTap() {
            tapCount++;
            clearTimeout(tapResetTimer);
            tapResetTimer = setTimeout(() => { tapCount = 0; }, 3000);

            if (tapCount >= 7) {
                tapCount = 0;
                if (!isAdmin) {
                    openAuthModal();
                } else {
                    showToast("Already in Admin Mode");
                }
            }
        }

        if (window.location.hash === "#admin") {
            setTimeout(openAuthModal, 500);
        }

        // --- 5. AUTHENTICATION ---
        auth.onAuthStateChanged(function(user) {
            currentUser = user;
            const adminControls = document.getElementById("adminControls");

            if (user) {
                isAdmin = true;
                adminControls.style.display = "flex";
                showToast("Admin Mode Activated");
            } else {
                isAdmin = false;
                adminControls.style.display = "none";
            }
            initFamilyTree();
        });

        function openAuthModal() {
            document.getElementById("authError").style.display = "none";
            document.getElementById("authEmail").value = "";
            document.getElementById("authPassword").value = "";
            document.getElementById("authModal").style.display = "flex";
        }

        function closeAuthModal() {
            document.getElementById("authModal").style.display = "none";
        }

        function performAuth() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const errDiv = document.getElementById("authError");

            if (!email || !password) {
                errDiv.innerText = "Please provide both email and password.";
                errDiv.style.display = "block";
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    closeAuthModal();
                    if (window.location.hash === "#admin") {
                        history.replaceState(null, null, ' ');
                    }
                })
                .catch(err => {
                    errDiv.innerText = err.message;
                    errDiv.style.display = "block";
                });
        }

        function signOutAdmin() {
            auth.signOut().then(() => {
                showToast("Returned to Viewer Mode");
            });
        }

        // --- 6. IMAGE COMPRESSION & FIREBASE STORAGE UPLOAD ---
        function compressImage(file, maxWidth, maxHeight, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width = Math.round((width * maxHeight) / height);
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        callback(blob);
                    }, "image/jpeg", 0.82);
                };
            };
        }

        function handleImageSelection(fileInput, mode) {
            const file = fileInput.files[0];
            if (!file) return;

            const previewImg = document.getElementById(mode + "PhotoPreview");
            const statusSpan = document.getElementById(mode + "UploadStatus");
            const hiddenUrl = document.getElementById(mode + "PhotoUrl");
            const saveBtn = document.getElementById(mode + "SaveBtn");

            statusSpan.innerText = "Optimizing...";
            saveBtn.disabled = true;

            compressImage(file, 400, 400, (compressedBlob) => {
                previewImg.src = URL.createObjectURL(compressedBlob);
                statusSpan.innerText = "Uploading to Cloud...";

                const uploadNodeId = (mode === "edit") ? selectedNodeId : ("temp_" + Date.now());
                const storageRef = storage.ref(`trees/${TENANT_ID}/avatars/${uploadNodeId}.jpg`);

                storageRef.put(compressedBlob)
                    .then(snapshot => snapshot.ref.getDownloadURL())
                    .then(downloadURL => {
                        hiddenUrl.value = downloadURL;
                        statusSpan.innerText = "Uploaded ✓";
                        statusSpan.style.color = "#4ade80";
                        saveBtn.disabled = false;
                        showToast("Photo Uploaded");
                    })
                    .catch(err => {
                        console.error("Upload error:", err);
                        statusSpan.innerText = "Upload failed";
                        statusSpan.style.color = "#ff6b6b";
                        saveBtn.disabled = false;
                        alert("Storage upload error: " + err.message);
                    });
            });
        }

        function toggleDeceasedFields(mode, isDeceased) {
            const group = document.getElementById(mode === 'add' ? 'addPassingYearGroup' : 'editPassingYearGroup');
            group.style.display = isDeceased ? 'block' : 'none';
        }

        // --- 7. CLOUD FIRESTORE PERSISTENCE ---
        function saveToStorage() {
            if (!isAdmin) return;

            try {
                familyData.forEach(syncNodeTags);
                const jsonStr = JSON.stringify(familyData);

                localStorage.setItem("thodar_family_data", jsonStr);
                if (window.AndroidBridge && typeof window.AndroidBridge.saveFamilyData === "function") {
                    window.AndroidBridge.saveFamilyData(jsonStr);
                }

                treeDocRef.set({
                    treeName: "Devendran Family Lineage",
                    tenantId: TENANT_ID,
                    adminUid: currentUser ? currentUser.uid : null,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    members: familyData
                }, { merge: true })
                .then(() => {
                    showToast("Cloud Synced");
                })
                .catch(err => {
                    console.error("Firestore sync error:", err);
                    showToast("Sync Error: " + err.message);
                });
            } catch (err) {
                console.error("Save error:", err);
            }
        }

        // --- 8. REAL-TIME CLOUD LISTENER ---
        treeDocRef.onSnapshot((docSnapshot) => {
            if (docSnapshot.exists && docSnapshot.data().members) {
                const cloudMembers = docSnapshot.data().members;
                if (JSON.stringify(cloudMembers) !== JSON.stringify(familyData)) {
                    familyData = cloudMembers;
                    familyData.forEach(syncNodeTags);
                    if (family) family.load(getVisibleNodes());
                    localStorage.setItem("thodar_family_data", JSON.stringify(familyData));
                    if (window.AndroidBridge && typeof window.AndroidBridge.saveFamilyData === "function") {
                        window.AndroidBridge.saveFamilyData(JSON.stringify(familyData));
                    }
                }
            } else if (isAdmin) {
                saveToStorage();
            }
        }, (error) => {
            console.warn("Firestore live listener offline:", error);
        });

        // Search & Jump logic with auto-expansion of collapsed ancestors
        function handleSearch(query) {
            const dropdown = document.getElementById("searchDropdown");
            if (!query || query.trim().length === 0) {
                dropdown.style.display = "none";
                return;
            }
            const q = query.toLowerCase();
            const matches = familyData.filter(m => m.name && m.name.toLowerCase().includes(q));

            if (matches.length === 0) {
                dropdown.innerHTML = '<div class="search-item" style="color: #7b7b94;">No relatives found</div>';
                dropdown.style.display = "block";
                return;
            }

            dropdown.innerHTML = matches.map(m => `
                <div class="search-item" onclick="jumpToPerson(${m.id})">
                    <span>${m.name}</span>
                    <span style="color: #7b7b94; font-size: 12px;">${m.place || (m.birthYear ? 'b. ' + m.birthYear : '')}</span>
                </div>
            `).join("");
            dropdown.style.display = "block";
        }

        function jumpToPerson(nodeId) {
            document.getElementById("searchDropdown").style.display = "none";
            document.getElementById("searchInput").value = "";
            if (family) {
                // Ensure all parents are uncollapsed so the searched person is visible
                collapsedParentIds.clear();
                family.load(getVisibleNodes());
                updateDockButtonState();

                setTimeout(() => {
                    family.center(nodeId, {
                        valign: FamilyTree.valign.center,
                        halign: FamilyTree.halign.center
                    });
                }, 150);
            }
        }

        document.addEventListener("click", function(e) {
            const topBar = document.getElementById("topBar");
            const dropdown = document.getElementById("searchDropdown");
            if (topBar && !topBar.contains(e.target) && dropdown) {
                dropdown.style.display = "none";
            }
        });

        /* --- ADD RELATIVE MODAL --- */
        function openAddRelativeModal(nodeId) {
            if (!isAdmin) return;
            selectedNodeId = nodeId;
            const person = familyData.find(m => m.id == nodeId);
            document.getElementById('modalTitle').innerText = "Add Relative to " + (person ? person.name : "");
            document.getElementById('personName').value = "";
            document.getElementById('personBirth').value = "";
            document.getElementById('personDeath').value = "";
            document.getElementById('personDeceased').value = "false";
            toggleDeceasedFields('add', false);
            document.getElementById('personPlace').value = "";
            document.getElementById('addPhotoUrl').value = "";
            document.getElementById('addPhotoPreview').src = "https://balkan.app/avatar/1.jpg";
            document.getElementById('addUploadStatus').innerText = "Gallery / Files";
            document.getElementById('addUploadStatus').style.color = "#4da3ff";
            document.getElementById('personNotes').value = "";
            document.getElementById('addModal').style.display = "flex";
        }

        function closeAddModal() {
            document.getElementById('addModal').style.display = "none";
            selectedNodeId = null;
        }

        function saveRelative() {
            if (!isAdmin) return;
            const name = document.getElementById('personName').value.trim();
            if (!name) {
                alert("Please enter a name.");
                return;
            }

            const relType = document.getElementById('relType').value;
            const gender = document.getElementById('personGender').value;
            const isDeceased = document.getElementById('personDeceased').value === "true";
            const birthYear = document.getElementById('personBirth').value.trim();
            const deathYear = isDeceased ? document.getElementById('personDeath').value.trim() : "";
            const place = document.getElementById('personPlace').value.trim();
            const photo = document.getElementById('addPhotoUrl').value.trim();
            const notes = document.getElementById('personNotes').value.trim();
            const target = familyData.find(m => m.id == selectedNodeId);

            if (!target) return;

            const newId = Date.now();
            const newMember = { 
                id: newId, 
                name: name, 
                gender: gender,
                isDeceased: isDeceased,
                tags: isDeceased ? ["deceased"] : []
            };
            if (birthYear) newMember.birthYear = birthYear;
            if (deathYear) newMember.deathYear = deathYear;
            if (place) newMember.place = place;
            if (photo) newMember.photo = photo;
            if (notes) newMember.notes = notes;

            if (relType === "child") {
                let fatherId = null;
                let motherId = null;

                if (target.gender === "male") {
                    fatherId = target.id;
                    motherId = (target.pids && target.pids.length > 0) ? target.pids[0] : null;
                } else {
                    motherId = target.id;
                    fatherId = (target.pids && target.pids.length > 0) ? target.pids[0] : null;
                }

                if (fatherId) newMember.fid = fatherId;
                if (motherId) newMember.mid = motherId;
                familyData.push(newMember);

            } else if (relType === "spouse") {
                newMember.pids = [target.id];
                if (!target.pids) target.pids = [];
                if (!target.pids.includes(newId)) target.pids.push(newId);
                familyData.push(newMember);

            } else if (relType === "father") {
                newMember.gender = "male";
                if (target.mid) {
                    newMember.pids = [target.mid];
                    const mother = familyData.find(m => m.id == target.mid);
                    if (mother) {
                        if (!mother.pids) mother.pids = [];
                        if (!mother.pids.includes(newId)) mother.pids.push(newId);
                    }
                }
                target.fid = newId;
                familyData.push(newMember);

            } else if (relType === "mother") {
                newMember.gender = "female";
                if (target.fid) {
                    newMember.pids = [target.fid];
                    const father = familyData.find(m => m.id == target.fid);
                    if (father) {
                        if (!father.pids) father.pids = [];
                        if (!father.pids.includes(newId)) father.pids.push(newId);
                    }
                }
                target.mid = newId;
                familyData.push(newMember);
            }

            closeAddModal();
            family.load(getVisibleNodes());
            saveToStorage();
        }

        /* --- EDIT DETAILS MODAL --- */
        function openEditModal(nodeId) {
            if (!isAdmin) return;
            selectedNodeId = nodeId;
            const person = familyData.find(m => m.id == nodeId);
            if (!person) return;

            document.getElementById('editModalTitle').innerText = "Edit " + person.name;
            document.getElementById('editPersonName').value = person.name || "";
            document.getElementById('editPersonGender').value = person.gender || "male";

            const isDeceased = !!person.isDeceased;
            document.getElementById('editPersonDeceased').value = isDeceased ? "true" : "false";
            toggleDeceasedFields('edit', isDeceased);

            document.getElementById('editPersonBirth').value = person.birthYear || "";
            document.getElementById('editPersonDeath').value = person.deathYear || "";
            document.getElementById('editPersonPlace').value = person.place || "";
            
            const photoVal = person.photo || "";
            document.getElementById('editPhotoUrl').value = photoVal;
            document.getElementById('editPhotoPreview').src = photoVal ? photoVal : "https://balkan.app/avatar/1.jpg";
            document.getElementById('editUploadStatus').innerText = photoVal ? "Current Photo Set" : "Gallery / Files";
            document.getElementById('editUploadStatus').style.color = "#a0a0b8";

            document.getElementById('editPersonNotes').value = person.notes || "";
            document.getElementById('editModal').style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = "none";
            selectedNodeId = null;
        }

        function savePersonEdits() {
            if (!isAdmin) return;
            const name = document.getElementById('editPersonName').value.trim();
            if (!name) {
                alert("Name cannot be empty.");
                return;
            }

            const person = familyData.find(m => m.id == selectedNodeId);
            if (!person) return;

            const isDeceased = document.getElementById('editPersonDeceased').value === "true";

            person.name = name;
            person.gender = document.getElementById('editPersonGender').value;
            person.isDeceased = isDeceased;
            person.birthYear = document.getElementById('editPersonBirth').value.trim();
            person.deathYear = isDeceased ? document.getElementById('editPersonDeath').value.trim() : "";
            person.place = document.getElementById('editPersonPlace').value.trim();
            person.photo = document.getElementById('editPhotoUrl').value.trim();
            person.notes = document.getElementById('editPersonNotes').value.trim();

            syncNodeTags(person);

            closeEditModal();
            family.load(getVisibleNodes());
            saveToStorage();
        }
    </script>
