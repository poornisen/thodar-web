<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thodar Family Tree</title>
    <script src="https://balkan.app/js/FamilyTree.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a24;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #tree {
            width: 100%;
            height: 100%;
        }

        /* Status Toast */
        #toast {
            visibility: hidden;
            min-width: 180px;
            background-color: #007bff;
            color: #fff;
            text-align: center;
            border-radius: 20px;
            padding: 10px 18px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* Modal Dialog Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }
        .modal-box {
            background: #252533;
            border: 1px solid #3b3b4f;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }
        .modal-box h3 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 18px;
            color: #4da3ff;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #a0a0b8;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 8px;
            background: #191924;
            border: 1px solid #3d3d52;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-cancel {
            background: #3b3b4f;
            color: #d1d1e0;
        }
        .btn-save {
            background: #007bff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="tree"></div>
    <div id="toast">Saved</div>

    <!-- Add Relative Modal -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Add Relative</h3>
            <div class="form-group">
                <label>Relationship</label>
                <select id="relType">
                    <option value="child">Child (Son / Daughter)</option>
                    <option value="spouse">Spouse / Partner</option>
                    <option value="father">Father</option>
                    <option value="mother">Mother</option>
                </select>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="personName" placeholder="Enter full name" />
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="personGender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn btn-save" onclick="saveRelative()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let selectedNodeId = null;

        const defaultSeedData = [
            // Generation 1: Grandparents
            { id: 1, pids: [2], name: "N. Devendran", gender: "male" },
            { id: 2, pids: [1], name: "D. Leelavathy", gender: "female" },

            // Generation 2: Children & In-Laws
            { id: 3, fid: 1, mid: 2, pids: [4], name: "D. Manivannan", gender: "male" },
            { id: 4, pids: [3], name: "K.V. Lakshmi", gender: "female" },
            { id: 5, fid: 1, mid: 2, pids: [7], name: "D. Sumathy", gender: "female" },
            { id: 7, pids: [5], name: "S. Sundaresan", gender: "male" },
            { id: 8, fid: 1, mid: 2, pids: [9], name: "D. Vijayarani", gender: "female" },
            { id: 9, pids: [8], name: "G.V. Ramesh", gender: "male" },
            { id: 10, fid: 1, mid: 2, pids: [11], name: "D. Senthil Kumar", gender: "male" },
            { id: 11, pids: [10], name: "S. Poornima", gender: "female" },

            // Generation 3: Grandchildren
            { id: 6, fid: 3, mid: 4, name: "P.M. Karthik Jogaian", gender: "male" },
            { id: 12, fid: 3, mid: 4, name: "P.M. Ganga Devi", gender: "female" }
        ];

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 2200);
        }

        // Single source of truth: our clean data array
        let familyData = [];

        function loadSavedData() {
            try {
                // 1. Try Android Native Bridge
                if (window.AndroidBridge && typeof window.AndroidBridge.loadFamilyData === "function") {
                    const androidData = window.AndroidBridge.loadFamilyData();
                    if (androidData && androidData.trim().length > 5) {
                        return JSON.parse(androidData);
                    }
                }
                // 2. Try Web / Safari localStorage
                const webData = localStorage.getItem("thodar_family_data");
                if (webData && webData.trim().length > 5) {
                    return JSON.parse(webData);
                }
            } catch (err) {
                console.error("Error loading data:", err);
            }
            // 3. Fallback to default seed data
            return JSON.parse(JSON.stringify(defaultSeedData));
        }

        function saveToStorage() {
            try {
                const jsonStr = JSON.stringify(familyData);

                // Save to web localStorage
                localStorage.setItem("thodar_family_data", jsonStr);

                // Save to Android Internal File
                if (window.AndroidBridge && typeof window.AndroidBridge.saveFamilyData === "function") {
                    window.AndroidBridge.saveFamilyData(jsonStr);
                }

                showToast("Saved Successfully");
            } catch (err) {
                console.error("Save error:", err);
                alert("Failed to save: " + err.message);
            }
        }

        // Initialize data array
        familyData = loadSavedData();

        // Initialize FamilyTree engine
        const family = new FamilyTree(document.getElementById("tree"), {
            template: "john",
            mode: "dark",
            mouseScrool: FamilyTree.action.zoom,
            nodeMenu: {
                addRel: {
                    text: "Add Relative",
                    onClick: function(nodeId) {
                        openAddRelativeModal(nodeId);
                    }
                },
                edit: { text: "Edit Details" },
                remove: { text: "Remove Person" }
            },
            nodeBinding: {
                field_0: "name"
            },
            nodes: familyData
        });

        // Sync changes made directly in Balkan's Edit drawer
        family.onUpdateNode(function(args) {
            const updated = args.addNodesData ? args.addNodesData[0] : null;
            if (updated && updated.id) {
                const idx = familyData.findIndex(item => item.id == updated.id);
                if (idx !== -1) {
                    if (updated.name) familyData[idx].name = updated.name;
                    if (updated.gender) familyData[idx].gender = updated.gender;
                    saveToStorage();
                }
            }
        });

        // Sync changes when someone removes a person
        family.onRemoveNode(function(args) {
            const removeId = args.id;
            familyData = familyData.filter(item => item.id != removeId);
            // Also clean up any pids pointing to the removed node
            familyData.forEach(item => {
                if (item.pids && Array.isArray(item.pids)) {
                    item.pids = item.pids.filter(p => p != removeId);
                }
                if (item.fid == removeId) delete item.fid;
                if (item.mid == removeId) delete item.mid;
            });
            saveToStorage();
        });

        function openAddRelativeModal(nodeId) {
            selectedNodeId = nodeId;
            const person = familyData.find(m => m.id == nodeId);
            document.getElementById('modalTitle').innerText = "Add Relative to " + (person ? person.name : "");
            document.getElementById('personName').value = "";
            document.getElementById('addModal').style.display = "flex";
        }

        function closeModal() {
            document.getElementById('addModal').style.display = "none";
            selectedNodeId = null;
        }

        function saveRelative() {
            const name = document.getElementById('personName').value.trim();
            if (!name) {
                alert("Please enter a name.");
                return;
            }

            const relType = document.getElementById('relType').value;
            const gender = document.getElementById('personGender').value;
            const target = familyData.find(m => m.id == selectedNodeId);

            if (!target) {
                alert("Could not locate selected person.");
                return;
            }

            const newId = Date.now();

            if (relType === "child") {
                let fatherId = null;
                let motherId = null;

                if (target.gender === "male") {
                    fatherId = target.id;
                    motherId = (target.pids && target.pids.length > 0) ? target.pids[0] : null;
                } else {
                    motherId = target.id;
                    fatherId = (target.pids && target.pids.length > 0) ? target.pids[0] : null;
                }

                const newChild = { id: newId, name: name, gender: gender };
                if (fatherId) newChild.fid = fatherId;
                if (motherId) newChild.mid = motherId;

                familyData.push(newChild);

            } else if (relType === "spouse") {
                const newSpouse = { id: newId, pids: [target.id], name: name, gender: gender };
                
                if (!target.pids) target.pids = [];
                if (!target.pids.includes(newId)) target.pids.push(newId);

                familyData.push(newSpouse);

            } else if (relType === "father") {
                const newFather = { id: newId, name: name, gender: "male" };
                if (target.mid) {
                    newFather.pids = [target.mid];
                    const mother = familyData.find(m => m.id == target.mid);
                    if (mother) {
                        if (!mother.pids) mother.pids = [];
                        if (!mother.pids.includes(newId)) mother.pids.push(newId);
                    }
                }
                target.fid = newId;
                familyData.push(newFather);

            } else if (relType === "mother") {
                const newMother = { id: newId, name: name, gender: "female" };
                if (target.fid) {
                    newMother.pids = [target.fid];
                    const father = familyData.find(m => m.id == target.fid);
                    if (father) {
                        if (!father.pids) father.pids = [];
                        if (!father.pids.includes(newId)) father.pids.push(newId);
                    }
                }
                target.mid = newId;
                familyData.push(newMother);
            }

            closeModal();

            // Reload the tree with our updated array
            family.load(familyData);

            // Persist immediately
            saveToStorage();
        }
    </script>
</body>
</html>
